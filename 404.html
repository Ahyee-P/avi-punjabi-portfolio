<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Avi Punjabi</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fbfbfa; --panel:#fff; --text:#1c2330; --dim:#4d5566; --faint:#666d7c; --accent:#1f3a5f; --accent-2:#2f6b63; --border:#e2e4e9; --border-strong:#c9cdd6; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
        background:var(--bg); color:var(--text); font-family:'Inter', system-ui, sans-serif; line-height:1.6; }
  main{ max-width:520px; width:100%; border:1px solid var(--border); background:var(--panel); border-radius:4px; padding:32px 28px; }
  .code{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-2); font-weight:600; margin:0 0 10px; }
  h1{ font-size:28px; line-height:1.2; margin:0 0 12px; }
  p{ color:var(--dim); margin:0 0 22px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  a.btn{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:13px; text-decoration:none; min-height:44px; padding:0 18px;
         display:inline-flex; align-items:center; border-radius:3px; border:1px solid var(--border-strong); color:var(--text); background:var(--panel); }
  a.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  a.btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  svg{ display:block; width:100%; max-width:220px; margin:0 0 20px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 220 90" role="img" aria-label="A two-link robot arm reaching for a target outside its workspace">
    <circle cx="40" cy="78" r="70" fill="none" stroke="#d5d8df" stroke-dasharray="3 5"/>
    <line x1="40" y1="78" x2="78" y2="46" stroke="#3f7c74" stroke-width="5" stroke-linecap="round"/>
    <line x1="78" y1="46" x2="108" y2="64" stroke="#1f3a5f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="40" cy="78" r="5" fill="#1c2330"/><circle cx="78" cy="46" r="4" fill="#1c2330"/>
    <circle cx="108" cy="64" r="6" fill="none" stroke="#1f3a5f" stroke-width="2"/>
    <line x1="108" y1="64" x2="192" y2="30" stroke="#9a4515" stroke-dasharray="2 3"/>
    <circle cx="192" cy="30" r="4" fill="#9a4515"/>

  <p class="code">Error 404 · target outside workspace</p>
  <h1>This page is out of reach.</h1>
  <p>The link may be broken, or the page may have moved. Everything on this site lives on the home page.</p>
  <div class="row">
    <a class="btn primary" href="/">Back to home</a>
    <a class="btn" href="/#projects">See projects</a>
  </div>
</main>

</html>
